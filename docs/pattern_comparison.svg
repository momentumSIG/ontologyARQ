<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750">
<rect width="1100" height="750" fill="#0d1117"/>
<text x="550" y="30" fill="#ffffff" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">Panel 2: Comparacion de Patrones - Modelado del mismo fenomeno</text>
<text x="550" y="52" fill="#8b949e" font-size="12" font-family="monospace" text-anchor="middle">Anfora Dressel 20: produccion - uso - deposicion - recuperacion | Temp 0.05</text>
<rect x="50" y="70" width="320" height="30" fill="#58a6ff" fill-opacity="0.2" rx="4"/>
<text x="210.0" y="90" fill="#58a6ff" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">P1: Event-Driven</text>
<text x="210.0" y="110" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">Cadena de eventos</text>
<rect x="390" y="70" width="320" height="30" fill="#3fb950" fill-opacity="0.2" rx="4"/>
<text x="550.0" y="90" fill="#3fb950" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">P2: State-Transition</text>
<text x="550.0" y="110" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">Secuencia de estados</text>
<rect x="730" y="70" width="320" height="30" fill="#f85149" fill-opacity="0.2" rx="4"/>
<text x="890.0" y="90" fill="#f85149" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">P4: Assignment-Intrinsic</text>
<text x="890.0" y="110" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">Cadena de asignaciones</text>
