<line x1="210.0" y1="260" x2="210.0" y2="290" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="210.0" y1="340" x2="210.0" y2="370" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="130" width="260" height="50" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6"/>
<text x="550.0" y="158" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">IntactState</text>
<rect x="420" y="210" width="260" height="50" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6"/>
<text x="550.0" y="238" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">FragmentedState</text>
<rect x="420" y="290" width="260" height="50" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6"/>
<text x="550.0" y="318" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">DiscardedState</text>
<rect x="420" y="370" width="260" height="50" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="6"/>
<text x="550.0" y="398" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">ExcavatedState</text>
<line x1="550.0" y1="180" x2="550.0" y2="210" stroke="#3fb950" stroke-width="2"/>
<line x1="550.0" y1="260" x2="550.0" y2="290" stroke="#3fb950" stroke-width="2"/>
<line x1="550.0" y1="340" x2="550.0" y2="370" stroke="#3fb950" stroke-width="2"/>
<rect x="760" y="130" width="260" height="50" fill="#161b22" stroke="#f85149" stroke-width="1.5" rx="6"/>
<text x="890.0" y="158" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">MaterialAssignment</text>
<rect x="760" y="210" width="260" height="50" fill="#161b22" stroke="#f85149" stroke-width="1.5" rx="6"/>
<text x="890.0" y="238" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">FunctionalAssignment</text>
<rect x="760" y="290" width="260" height="50" fill="#161b22" stroke="#f85149" stroke-width="1.5" rx="6"/>
<text x="890.0" y="318" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">TypologicalAssignment</text>
<rect x="760" y="370" width="260" height="50" fill="#161b22" stroke="#f85149" stroke-width="1.5" rx="6"/>
<text x="890.0" y="398" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">ChronologicalAssignment</text>
<line x1="890.0" y1="180" x2="890.0" y2="210" stroke="#f85149" stroke-width="2"/>
<line x1="890.0" y1="260" x2="890.0" y2="290" stroke="#f85149" stroke-width="2"/>
<line x1="890.0" y1="340" x2="890.0" y2="370" stroke="#f85149" stroke-width="2"/>
<rect x="400" y="130" width="300" height="50" fill="#161b22" stroke="#ffffff" stroke-width="2" rx="6"/>
<text x="550" y="158" fill="#ffffff" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">ArchaeologicalObject: Dressel 20</text>
<line x1="400" y1="155" x2="370" y2="155" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
<line x1="700" y1="155" x2="730" y2="155" stroke="#8b949e" stroke-width="1" stroke-dasharray="4"/>
<text x="50" y="460" fill="#58a6ff" font-size="12" font-family="monospace" font-weight="bold">P1: Enfoque en eventos</text>
<text x="50" y="480" fill="#8b949e" font-size="11" font-family="monospace">Modela el WHAT HAPPENED
<text x="50" y="498" fill="#8b949e" font-size="11" font-family="monospace">Cada evento es una instancia de crm:E5_Event
<text x="50" y="516" fill="#8b949e" font-size="11" font-family="monospace">El objeto es participante (crm:P102_fell_within)
<text x="390" y="460" fill="#3fb950" font-size="12" font-family="monospace" font-weight="bold">P2: Enfoque en estados</text>
<text x="390" y="480" fill="#8b949e" font-size="11" font-family="monospace">Modela el HOW IT IS
<text x="390" y="498" fill="#8b949e" font-size="11" font-family="monospace">Cada estado es una condicion del objeto
<text x="390" y="516" fill="#8b949e" font-size="11" font-family="monospace">Transiciones implicitas entre estados
<text x="730" y="460" fill="#f85149" font-size="12" font-family="monospace" font-weight="bold">P4: Enfoque en asignaciones</text>
<text x="730" y="480" fill="#8b949e" font-size="11" font-family="monospace">Modela el WHAT WE KNOW
<text x="730" y="498" fill="#8b949e" font-size="11" font-family="monospace">Cada asignacion es un acto interpretativo
<text x="730" y="516" fill="#8b949e" font-size="11" font-family="monospace">Separa objeto de interpretacion
<rect x="50" y="560" width="1000" height="80" fill="#161b22" stroke="#8b949e" stroke-width="1" rx="6"/>
<text x="550" y="585" fill="#ffffff" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">Conclusion clave:</text>
<text x="550" y="608" fill="#8b949e" font-size="12" font-family="monospace" text-anchor="middle">Los 3 patrones modelan el mismo fenomeno arqueologico pero desde perspectivas complementarias:
<text x="550" y="628" fill="#8b949e" font-size="12" font-family="monospace" text-anchor="middle">P1 = realidad historica (eventos) | P2 = condicion material (estados) | P4 = conocimiento arqueologico (asignaciones)
</svg>