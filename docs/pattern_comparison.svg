<text x="210.0" y="158" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">ProductionEvent</text>
<rect x="80" y="210" width="260" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="6"/>
<text x="210.0" y="238" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">UseEvent</text>
<rect x="80" y="290" width="260" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="6"/>
<text x="210.0" y="318" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">DepositionEvent</text>
<rect x="80" y="370" width="260" height="50" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="6"/>
<text x="210.0" y="398" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">RecoveryEvent</text>
